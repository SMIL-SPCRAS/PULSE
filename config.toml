[App]
TITLE = "PULSE"
SUBTITLE = "Psychological Characteristics Unified Learning via Speech-based Estimation"
DESCRIPTION = "A Gradio application for speech-based estimation of psychological characteristics using the PULSE framework."
VERSION = "1.0.0"
CSS_PATH = "app.css"

[Server]
NAME = "127.0.0.1"
PORT = 7860

[AudioValidation]
MIN_DURATION_SECONDS = 1.0
MAX_DURATION_SECONDS = 60.0
RECOMMENDED_SAMPLE_RATE = 16000
RECOMMENDED_NUM_CHANNELS = 1

[AudioDecoding]
TARGET_SAMPLE_RATE = 16000
TARGET_NUM_CHANNELS = 1

[AudioPreprocessing]
TARGET_DURATION_SECONDS = 15.0
ENABLE_PEAK_NORMALIZATION = true
PEAK_NORMALIZATION_EPS = 1e-8

[FeatureExtraction]
WAV2VEC_MODEL_NAME = "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"
WAV2VEC_HF_MODEL_ID = "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"
WAV2VEC_MODEL_DIR = "wav2vec2/audeering-wav2vec2-large-robust-12-ft-emotion-msp-dim"
SAMPLE_RATE = 16000
DEVICE = "auto"
LOCAL_FILES_ONLY = true

[Model]
USE_REAL_MODEL = true
CHECKPOINT_FILE = "pulse/best_model.pt"
HF_CHECKPOINT_REPO_ID = "DmitryRyumin/PULSE"
HF_CHECKPOINT_FILENAME = "best_model.pt"
DEVICE = "auto"
INPUT_DIM = 1024
D_MODEL = 256
NUM_LAYERS = 4
DROPOUT = 0.1
MAX_LEN = 15000
MAMBA_D_STATE = 8
MAMBA_D_CONV = 3
MAMBA_EXPAND = 2

[Attribution]
ENABLE_REAL_ATTRIBUTION = true
FALLBACK_TO_PLACEHOLDER = true
METHOD = "input_x_gradient"
REDUCTION = "sum_abs"
MAX_POINTS = 256
EPS = 1e-12
ENABLE_SPEECH_MASK = true
SPEECH_MASK_FRAME_MS = 25.0
SPEECH_MASK_HOP_MS = 10.0
SPEECH_MASK_THRESHOLD_RATIO = 0.16
SPEECH_MASK_MIN_ACTIVE_RATIO = 0.005
SPEECH_MASK_CONTEXT_SECONDS = 0.10
SPEECH_MASK_SMOOTHING_SECONDS = 0.07
SPEECH_MASK_SILENCE_FLOOR = 0.0
LOG_SPEECH_MASK = true
SMOOTHGRAD_SAMPLES = 6
SMOOTHGRAD_NOISE_STD_RATIO = 0.02
SMOOTHGRAD_INCLUDE_CLEAN_SAMPLE = true

[Visualization]
WAVEFORM_MAX_POINTS = 1200
TRANSCRIPT_MAX_CHARS = 2500
TRANSCRIPT_WRAP = 220
SHOW_SPEECH_ACTIVITY = true

[Transcription]
ENABLE = true
FALLBACK_TO_EMPTY = true
MODEL_NAME = "large-v3"
HF_MODEL_ID = "Systran/faster-whisper-large-v3"
MODEL_DIR = "faster-whisper/large-v3"
LOCAL_FILES_ONLY = true
DEVICE = "cpu"
COMPUTE_TYPE = "int8"
CPU_THREADS = 8
NUM_WORKERS = 1
LANGUAGE = "auto"
BEAM_SIZE = 5
BEST_OF = 5
TEMPERATURE = 0.0
WORD_TIMESTAMPS = true
VAD_FILTER = true
VAD_MIN_SILENCE_DURATION_MS = 500
CONDITION_ON_PREVIOUS_TEXT = true
INITIAL_PROMPT = ""

[Progress]
STAGES = [
    { key = "validation", weight = 1.0 },
    { key = "decoding", weight = 1.0 },
    { key = "preprocessing", weight = 1.0 },
    { key = "waveform", weight = 1.0 },
    { key = "whisper_loading", weight = 10.0 },
    { key = "transcription", weight = 20.0 },
    { key = "wav2vec_loading", weight = 8.0 },
    { key = "feature_extraction", weight = 8.0 },
    { key = "pulse_model_loading", weight = 8.0 },
    { key = "model_inference", weight = 2.0 },
    { key = "output_adaptation", weight = 1.0 },
    { key = "attribution", weight = 36.0 },
    { key = "packaging", weight = 2.0 },
    { key = "visualization", weight = 1.0 },
]

[StaticPaths]
EXAMPLES = "examples"
IMAGES = "static/images"
MODELS = "models"

[Images]
LANGUAGES = [ "flags/en.svg", "flags/ru.svg" ]

[Examples]
AUDIO = [
    "01_emotion_happiness.wav",
    "02_emotion_fear.wav",
    "03_interview_question_01.wav",
    "04_interview_question_03.wav",
    "05_speech_segment_01.wav",
    "06_speech_segment_02.wav",
    "07_speech_segment_03.wav",
    "08_speech_segment_04.wav",
]

[Languages]
CHOICES = [ "English", "Русский" ]
DEFAULT = "English"

[Tabs]
APP = [ "⭐ Application", "⭐ Приложение" ]
SETTINGS = [ "⚙️ Settings", "⚙️ Настройки" ]
